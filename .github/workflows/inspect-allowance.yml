name: Inspect allowance format

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lidl-auto-refill
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Inspect only aggregate allowance fields without activating a refill
        run: |
          python - <<'PY'
          import ast, json, logging, math, re
          from datetime import datetime, timezone
          from pathlib import Path
          from app import create_client_with_recovery
          from config import Config
          from http_client import CONSUMPTIONS_QUERY, parse_api_allowance
          from lidl_client import UnexpectedResponseError
          client = None
          try:
              client = create_client_with_recovery(Config.from_env(), logging.getLogger('inspect'))
              data = client._graphql('consumptions', CONSUMPTIONS_QUERY, {})
              captured = datetime.now(timezone.utc)
              report = {'captured_at': captured.isoformat(), 'buckets': []}
              try:
                  report['remaining_gb'] = parse_api_allowance(data, now=captured)
              except UnexpectedResponseError as error:
                  tree = ast.parse(Path('http_client.py').read_text())
                  fixed = {node.args[0].value for node in ast.walk(tree) if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == 'UnexpectedResponseError' and node.args and isinstance(node.args[0], ast.Constant) and isinstance(node.args[0].value, str)}
                  report['rejection'] = str(error) if str(error) in fixed else type(error).__name__
              rows = data.get('consumptions', {}).get('consumptionsForUnit', [])
              for row in rows[:20] if isinstance(rows, list) else []:
                  if not isinstance(row, dict):
                      report['buckets'].append({'invalid_row': True})
                      continue
                  item = {'type': row.get('type') if row.get('type') in {'DATA', 'REFILLABLE_DATA', 'VOICE', 'SMS'} else 'unrecognized', 'unit': row.get('unit') if row.get('unit') in {'GB', 'MB', 'MIN', 'SMS'} else 'unrecognized'}
                  for name in ('left', 'max'):
                      value = row.get(name)
                      item[name] = value if type(value) in {int, float} and math.isfinite(value) else None
                  try:
                      expiry = datetime.fromisoformat(row.get('expirationDate', '').replace('Z', '+00:00'))
                      item['expiration'] = expiry.isoformat()
                      item['expired'] = expiry <= captured if expiry.tzinfo else None
                  except (ValueError, TypeError, AttributeError):
                      item['expiration_invalid'] = True
                  report['buckets'].append(item)
              try:
                  tariff_data = client._graphql('bookedTariff', 'query bookedTariff { tariffs { bookedTariff { statusKey tariffState isSuspendedActive isPendingTariff renewContractDate possibleChangingDate changeTariffDate terminationDate __typename } __typename } }', {})
                  tariff = tariff_data.get('tariffs', {}).get('bookedTariff', {})
                  status = {}
                  for key in ('statusKey', 'tariffState'):
                      value = tariff.get(key)
                      status[key] = value if isinstance(value, str) and re.fullmatch('[A-Za-z0-9_-]{1,60}', value) else None
                  for key in ('isSuspendedActive', 'isPendingTariff'):
                      value = tariff.get(key)
                      status[key] = value if type(value) is bool else None
                  for key in ('renewContractDate', 'possibleChangingDate', 'changeTariffDate', 'terminationDate'):
                      try:
                          status[key] = datetime.fromisoformat(tariff.get(key, '').replace('Z', '+00:00')).isoformat()
                      except (ValueError, TypeError, AttributeError):
                          status[key] = None
                  report['tariff_status'] = status
              except Exception as error:
                  report['tariff_inspection_error'] = type(error).__name__
              try:
                  balance_data = client._graphql('balanceInfo', 'query balanceInfo { currentCustomer { balance __typename } }', {})
                  balance = balance_data.get('currentCustomer', {}).get('balance')
                  report['credit_positive'] = balance > 0 if type(balance) in {int, float} and math.isfinite(balance) else None
              except Exception as error:
                  report['credit_inspection_error'] = type(error).__name__
              print('Allowance diagnostics: ' + json.dumps(report))
          except Exception as error:
              print('Allowance inspection stopped: ' + type(error).__name__)
              raise SystemExit(1)
          finally:
              if client is not None:
                  client.close()
          PY
        env:
          CLIENT_MODE: http
          STATE_BACKEND: postgres
          STATE_ACCOUNT_KEY: lidl-main
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          LIDL_TOKEN_STATE_KEY: ${{ secrets.LIDL_TOKEN_STATE_KEY }}
          LIDL_USERNAME: ${{ secrets.LIDL_USERNAME }}
          LIDL_PASSWORD: ${{ secrets.LIDL_PASSWORD }}
          LIDL_CLIENT_ID: ${{ secrets.LIDL_CLIENT_ID }}
          LIDL_CLIENT_SECRET: ${{ secrets.LIDL_CLIENT_SECRET }}
          DRY_RUN: 'true'
