name: Bootstrap cloud session

on:
  workflow_dispatch:
    inputs:
      replace_session:
        description: 'Replace an existing session after the active run ends'
        type: boolean
        default: false

concurrency:
  group: lidl-auto-refill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Explicit one-time login
        shell: bash
        run: |
          if [ "$REPLACE_SESSION" = "true" ]; then
            python bootstrap_session.py --replace
          else
            python bootstrap_session.py
          fi
        env:
          REPLACE_SESSION: ${{ inputs.replace_session }}
          CLIENT_MODE: http
          STATE_BACKEND: postgres
          STATE_ACCOUNT_KEY: lidl-main
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          LIDL_TOKEN_STATE_KEY: ${{ secrets.LIDL_TOKEN_STATE_KEY }}
          LIDL_USERNAME: ${{ secrets.LIDL_USERNAME }}
          LIDL_PASSWORD: ${{ secrets.LIDL_PASSWORD }}

