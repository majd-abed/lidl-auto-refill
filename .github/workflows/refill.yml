name: Tests and mock dry-run

on:
  workflow_dispatch:

# Serializes runs in this repository. Durable cloud state is still required
# before live scheduling; hosted runners do not preserve the SQLite database.
concurrency:
  group: lidl-auto-refill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: lidl_tests
          POSTGRES_USER: lidl_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lidl_test -d lidl_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
        env:
          TEST_DATABASE_URL: postgresql://lidl_test:ci-test-only@127.0.0.1:5432/lidl_tests?sslmode=disable
      - name: Simulate an allowance check
        run: python app.py
        env:
          CLIENT_MODE: mock
          DRY_RUN: 'true'
          MOCK_REMAINING_DATA: '0.20 GB'
          REFILL_THRESHOLD_GB: '0.30'
          STATE_DB_PATH: '${{ runner.temp }}/lidl-phase1/refill.sqlite3'

# Phase 6: add schedule with cron '*/5 * * * *' after the controlled HTTP
# refill and durable cloud state are validated. Local token renewal is tested.
# Future live credentials must use GitHub Actions Secrets, for example:
# LIDL_TOKEN_STATE_KEY: ${{ secrets.LIDL_TOKEN_STATE_KEY }}
