name: Inspect cloud scheduler support

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Inspect scheduler extensions without changing storage
        run: |
          python - <<'PY'
          import json
          from config import Config, ConfigurationError
          from postgres_store import _Postgres
          from state_store import StateStoreError
          try:
              config = Config.from_env()
              store = _Postgres(config.database_url, config.state_account_key, config.database_ca_cert)
              with store._database() as connection, connection.transaction():
                  connection.execute("SET LOCAL statement_timeout = '20s'")
                  rows = connection.execute("SELECT name, installed_version IS NOT NULL FROM pg_available_extensions WHERE name IN ('pg_cron', 'pg_net', 'supabase_vault')").fetchall()
              print('Scheduler extension support: ' + json.dumps({name: {'available': True, 'installed': installed} for name, installed in rows}))
          except (ConfigurationError, StateStoreError) as error:
              print(error)
              raise SystemExit(1)
          PY
        env:
          CLIENT_MODE: http
          STATE_BACKEND: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
