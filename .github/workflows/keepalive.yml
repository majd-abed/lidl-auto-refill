name: Keep scheduled checks active

on:
  schedule:
    - cron: '17 3 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lidl-auto-refill-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUD_CHECKS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Record repository activity
        shell: bash
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/automation-heartbeat.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/automation-heartbeat.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Keep scheduled automation active'
          git push origin "HEAD:${GITHUB_REF_NAME}"
